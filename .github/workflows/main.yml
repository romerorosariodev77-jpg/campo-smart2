name: Generar APK CampoSmart

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Dependencias
      run: npm install

    - name: Inicializar o Sincronizar Android
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Generar Iconos Oficiales CampoSmart
      run: npx capacitor-assets generate --android --icon

    - name: Sincronizar Web App
      run: npx cap sync android

    - name: Compilar APK con Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Guardar APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: CampoSmart-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
