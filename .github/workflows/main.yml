name: Generar APK CampoSmart

on:
  workflow_dispatch: # Esto activa el botón para arrancar manualmente
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Dependencias
      run: npm install

    - name: Crear carpeta temporal de Android
      run: mkdir -p android

    - name: Agregar Plataforma Android
      run: npx cap add android

    - name: Sincronizar Web App
      run: npx cap sync android

    - name: Compilar APK con Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Guardar APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: CampoSmart-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk  
